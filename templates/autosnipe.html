<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoSnipe - Solivox</title>
  <!-- Project vendor CSS (restore to get same styling) -->
  <link rel="stylesheet" href=".././static/vendor/vendor/jqvmap/css/jqvmap.min.css">
  <link rel="stylesheet" href=".././static/vendor/vendor/chartist/css/chartist.min.css">
  <link rel="stylesheet" href=".././static/vendor/vendor/bootstrap-select/dist/css/bootstrap-select.min.css">
  <link rel="stylesheet" href=".././static/vendor/vendor/owl-carousel/owl.carousel.css">
  <link rel="stylesheet" href=".././static/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    /* minimal safe overrides to ensure layout if some vendor files 404 */
    body { background: #f4f4f6; }
    .content-body { padding: 24px; }
    .compact-header { display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px; margin-top: 32px; }
    .autosniper-card { background:#3b3a54; color:#fff; }
  </style>
</head>
<body>
  <!-- Nav header (kept minimal but using project classes) -->
  <div id="main-wrapper">
    <div class="nav-header">
      <a href="/" class="brand-logo">
        <h1 class="brand-title">Solivox</h1>
      </a>
      <div class="nav-control">
        <div class="hamburger"><span class="line"></span><span class="line"></span><span class="line"></span></div>
      </div>
    </div>

    <!-- Sidebar (restore basic project sidebar structure) -->
    <div class="deznav">
      <div class="deznav-scroll">
        <ul class="metismenu" id="menu">
          <li>
            <ul aria-expanded="false">
              <li><a href="/">Home</a></li>
              <li><a href="/dashboard">Dashboard</a></li>
              <li><a href="/auto-snipe" class="mm-active">AutoSnipe</a></li>
              <li><a href="/my-wallets">My Wallets</a></li>
              <li><a href="/transactions">Order History</a></li>
              <li><a href="/logs">Logs</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>

    <!-- Content body -->
    <div class="content-body">
      <div class="container-fluid">
        <!-- Compact header only: Add button and active toggle -->
        <div class="compact-header">
          <h3 class="mb-0">AutoSnipe</h3>
          <div>
            <button id="add-autosniper-btn" class="btn btn-primary btn-sm">Add New AutoSniper</button>
            <div id="top_active_toggle" class="form-check form-switch d-inline-block ms-3 align-middle d-none">
              <input class="form-check-input" type="checkbox" id="active" checked>
              <label class="form-check-label" for="active">Active</label>
            </div>
          </div>
        </div>

        <!-- Listing area for small cards -->
        <div id="autosnipers-container" class="row g-3">
          <!-- cards injected by autosnipe_manager.js -->
        </div>

      </div>
    </div>

    <!-- Add / Edit Modal (expanded with all fields) -->
    <div class="modal fade" id="autosniperModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <form id="autosniperModalForm">
            <div class="modal-header">
              <h5 class="modal-title">Add / Edit AutoSniper</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onclick="if(window.hideModal) hideModal();"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="modal_autosniper_id" />
              <div class="container-fluid">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Buy Txns &gt; USD</label>
                    <input type="number" id="modal_buy_txns_over_80_usd" class="form-control" value="80" />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Minimum Buy Txns</label>
                    <input type="number" id="modal_min_txns" class="form-control" value="5" />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label">Time from Launch (sec)</label>
                    <input type="number" id="modal_launch_delay" class="form-control" value="5" />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Buy Amount (SOL)</label>
                    <input type="number" step="0.0001" min="0" id="modal_buy_amount" class="form-control" value="1" />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label">Buy Slippage %</label>
                    <input type="number" id="modal_slippage" class="form-control" value="100" />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Priority Fee (SOL)</label>
                    <input type="number" step="0.0001" id="modal_priority_fee" class="form-control" value="0.01" />
                  </div>

                  <div class="col-12"><hr /></div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label">Sell - drop cutoff (%)</label>
                    <input type="number" id="modal_drop_cutoff" class="form-control" value="30" />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Sell - until profit reaches (%)</label>
                    <input type="number" id="modal_drop_until_profit" class="form-control" value="99" />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label">Sell - after 100% profit, sell if drops (%)</label>
                    <input type="number" id="modal_drop_after_100" class="form-control" value="50" />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Sell - after 400% profit, sell if drops (%)</label>
                    <input type="number" id="modal_drop_after_400" class="form-control" value="30" />
                  </div>

                  <!-- Profit target sell percentages -->
                  <div class="col-md-4 mb-3">
                    <label class="form-label">At 200% profit, sell %</label>
                    <input type="number" id="modal_sell_at_200" class="form-control" value="10" />
                  </div>
                  <div class="col-md-4 mb-3">
                    <label class="form-label">At 400% profit, sell %</label>
                    <input type="number" id="modal_sell_at_400" class="form-control" value="10" />
                  </div>
                  <div class="col-md-4 mb-3">
                    <label class="form-label">At 1000% profit, sell %</label>
                    <input type="number" id="modal_sell_at_1000" class="form-control" value="10" />
                  </div>
                  <div class="col-md-4 mb-3">
                    <label class="form-label">At 1500% profit, sell %</label>
                    <input type="number" id="modal_sell_at_1500" class="form-control" value="10" />
                  </div>
                  <div class="col-md-4 mb-3">
                    <label class="form-label">At 2500% profit, sell %</label>
                    <input type="number" id="modal_sell_at_2500" class="form-control" value="10" />
                  </div>
                  <div class="col-md-4 mb-3">
                    <label class="form-label">At 4000% profit, sell %</label>
                    <input type="number" id="modal_sell_at_4000" class="form-control" value="10" />
                  </div>
                  <div class="col-md-4 mb-3">
                    <label class="form-label">At 10000% profit, sell %</label>
                    <input type="number" id="modal_sell_at_10000" class="form-control" value="10" />
                  </div>

                  <div class="col-12 mt-2 mb-1">
                    <div class="form-check form-switch">
                      <input class="form-check-input" type="checkbox" id="modal_active" checked>
                      <label class="form-check-label" for="modal_active">Active</label>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" id="modal-delete-btn" class="btn btn-danger me-auto" style="display:none">Delete</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" onclick="if(window.hideModal) hideModal();">Cancel</button>
              <button type="submit" class="btn btn-primary">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Fallback hideModal available if needed -->
    <script>
      if (!window.hideModal) {
        window.hideModal = function(){
          try{
            const modalEl = document.getElementById('autosniperModal');
            if(!modalEl) return;
            modalEl.classList.remove('show'); modalEl.style.display='none'; modalEl.setAttribute('aria-hidden','true'); modalEl.removeAttribute('aria-modal');
            document.querySelectorAll('.modal-backdrop').forEach(b=>b.remove()); try{ document.body.classList.remove('modal-open'); }catch(e){}
          }catch(e){console.error('hideModal fallback', e)}
        }
      }
    </script>

    <!-- Sidebar toggle behavior: keep same behavior as Home page -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        try {
          const hamburger = document.querySelector('.hamburger');
          const sidebar = document.querySelector('.deznav');
          const contentBody = document.querySelector('.content-body');
          // If any element missing, no-op
          if (!hamburger || !sidebar || !contentBody) return;

          // Initialize layout if sidebar visible/hidden
          function setLayoutForSidebarHidden(hidden) {
            if (hidden) {
              sidebar.classList.add('d-none');
              contentBody.style.marginLeft = '2rem';
            } else {
              sidebar.classList.remove('d-none');
              contentBody.style.marginLeft = '21rem';
            }
          }

          // If the sidebar was previously hidden via class, respect it
          setLayoutForSidebarHidden(sidebar.classList.contains('d-none'));

          hamburger.addEventListener('click', function () {
            const hidden = sidebar.classList.toggle('d-none');
            setLayoutForSidebarHidden(hidden);
          });
        } catch (e) {
          console.error('Sidebar toggle init error', e);
        }
      });
    </script>

    <!-- Scripts (rehydrate project scripts; non-existing files may 404 but styling will be loaded above) -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src=".././static/vendor/vendor/global/global.min.js"></script>
    <script src=".././static/js/js/custom.min.js"></script>
    <script src="/static/js/js/autosnipe_manager.js"></script>

  </div>
</div>
</body>
</html>
