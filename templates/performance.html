<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Performance - Solivox</title>
  <link rel="icon" type="image/png" href="/static/images/solivox-icon.png">
  <!-- Project vendor CSS (same set autosnipe.html uses, for the shared nav/sidebar chrome) -->
  <link rel="stylesheet" href=".././static/vendor/vendor/jqvmap/css/jqvmap.min.css">
  <link rel="stylesheet" href=".././static/vendor/vendor/chartist/css/chartist.min.css">
  <link rel="stylesheet" href=".././static/vendor/vendor/bootstrap-select/dist/css/bootstrap-select.min.css">
  <link rel="stylesheet" href=".././static/vendor/vendor/owl-carousel/owl.carousel.css">
  <link rel="stylesheet" href=".././static/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-dark: #1a1a2e;
      --bg-card: #2d2b4f;
      --bg-button: #4a3aff;
      --text-primary: #ffffff;
      --text-secondary: #b8b8d1;
    }
    .content-body { padding: 24px; background-color: var(--bg-dark); color: var(--text-primary); min-height: 100vh; }
    .page-container { max-width: 1300px; margin: 0 auto; }
    .page-container h2 { margin-bottom: 20px; }
    .card { background-color: var(--bg-card); border-radius: 8px; padding: 15px; margin-bottom: 20px; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .filters select {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      border: 1px solid var(--text-secondary);
      border-radius: 6px;
      padding: 6px 10px;
    }
    .range-btn {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      border: 1px solid var(--text-secondary);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
    }
    .range-btn.active { background-color: var(--bg-button); border-color: var(--bg-button); }
    .stats-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
    .stat-card { background-color: var(--bg-card); padding: 15px; border-radius: 8px; }
    .stat-label { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 5px; }
    .stat-value { font-size: 1.4rem; font-weight: bold; }
    .chart-container { height: 380px; }
    .empty-state { color: var(--text-secondary); padding: 20px; text-align: center; }
  </style>
</head>
<body>
  <div id="main-wrapper">
    <div class="nav-header">
      <a href="/" class="brand-logo">
        <h1 class="brand-title">Solivox</h1>
      </a>
      <div class="nav-control">
        <div class="hamburger"><span class="line"></span><span class="line"></span><span class="line"></span></div>
      </div>
    </div>

    <div class="deznav">
      <div class="deznav-scroll">
        <ul class="metismenu" id="menu">
          <li>
            <ul aria-expanded="false">
              <li><a href="/">Home</a></li>
              <li><a href="/pending-trades">Pending Trades</a></li>
              <li><a href="/dashboard">Dashboard</a></li>
              <li><a href="/auto-snipe">AutoSnipe</a></li>
              <li><a href="/my-wallets">My Wallets</a></li>
              <li><a href="/transactions">Order History</a></li>
              <li><a href="/performance" class="mm-active">Performance</a></li>
              <li><a href="/logs">Logs</a></li>
              <li><a href="/log-analysis">Log Analysis</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>

    <div class="content-body">
      <div class="page-container">
        <h2>Performance</h2>

        <div class="card">
          <div class="filters" style="margin-bottom: 10px;">
            <button class="range-btn" data-range="today">Today</button>
            <button class="range-btn active" data-range="7d">7d</button>
            <button class="range-btn" data-range="30d">30d</button>
            <button class="range-btn" data-range="all">All</button>
          </div>
          <div class="filters">
            <select id="pathFilter">
              <option value="">Path: Both</option>
              <option value="buy">Buy</option>
              <option value="sell">Sell</option>
            </select>
            <select id="stageFilter">
              <option value="total">Stage: Total</option>
              <option value="quote">Quote</option>
              <option value="swap">Swap</option>
              <option value="send">Send</option>
              <option value="db">DB</option>
            </select>
          </div>
        </div>

        <div class="stats-container">
          <div class="stat-card">
            <div class="stat-label">Current buy total (avg ms)</div>
            <div class="stat-value" id="statBuyAvg">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Current sell total (avg ms)</div>
            <div class="stat-value" id="statSellAvg">-</div>
          </div>
        </div>

        <div class="card">
          <div class="chart-container"><canvas id="latencyChart"></canvas></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sidebar toggle behavior: same as every other page -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      try {
        const hamburger = document.querySelector('.hamburger');
        const sidebar = document.querySelector('.deznav');
        const contentBody = document.querySelector('.content-body');
        if (!hamburger || !sidebar || !contentBody) return;
        function setLayoutForSidebarHidden(hidden) {
          if (hidden) { sidebar.classList.add('d-none'); contentBody.style.marginLeft = '2rem'; }
          else { sidebar.classList.remove('d-none'); contentBody.style.marginLeft = '21rem'; }
        }
        setLayoutForSidebarHidden(sidebar.classList.contains('d-none'));
        hamburger.addEventListener('click', function () {
          setLayoutForSidebarHidden(sidebar.classList.toggle('d-none'));
        });
      } catch (e) { console.error('Sidebar toggle init error', e); }
    });
  </script>

  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src=".././static/vendor/vendor/global/global.min.js"></script>
  <script src=".././static/js/js/custom.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/js/performance.js"></script>
</body>
</html>
