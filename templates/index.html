<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Trading Bot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            color: #00c6ff;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.8rem;
            color: #00ffaa;
            margin-top: 30px;
        }

        div {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            margin: 20px auto;
            width: 50%;
            box-shadow: 0px 4px 10px rgba(0, 255, 255, 0.2);
        }

        label {
            font-size: 1rem;
            font-weight: bold;
            display: block;
            margin-top: 10px;
            color: #ffffff;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            text-align: center;
        }

        button {
            background-color: #00c6ff;
            color: #fff;
            border: none;
            padding: 12px 20px;
            margin: 10px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #00ffaa;
        }

        #logs {
            background-color: #000;
            color: #0f0;
            padding: 10px;
            text-align: left;
            font-size: 0.9rem;
            max-height: 200px;
            overflow-y: auto;
            border-radius: 5px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .key { color: #ffcc00; }
        .string { color: #00ffaa; }
        .number { color: #00c6ff; }
        .boolean { color: #ff4444; }

        /* Coin Monitoring Section */
        #coin-monitoring {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .coin {
            background-color: #2a2a2a;
            padding: 10px;
            border-radius: 5px;
            margin: 10px;
            width: 150px;
            text-align: center;
        }

        .coin h3 {
            font-size: 1.2rem;
            color: #00ffaa;
        }

        .coin p {
            font-size: 1rem;
            color: #00c6ff;
        }
    </style>
</head>
<body>
    <h1>Solivox Trading Bot</h1>

    <!-- Coin Monitoring Section -->
    <div>
        <h2>Coin Monitoring Dashboard</h2>
        <div id="coin-monitoring">
            <!-- Coin data will be dynamically inserted here -->
        </div>
    </div>

    <div>
        <h2>Wallet Management</h2>
        <button onclick="createWallet()">Create Wallet</button>
        <button onclick="checkBalance()">Check Balance</button>
    </div>

    <!-- Fund Wallet Section -->
    <div>
        <h2>Fund Wallet</h2>
        <label for="fundPublicKey">Public Key:</label>
        <input type="text" id="fundPublicKey" placeholder="Enter Public Key">

        <label for="fundAmount">Amount (SOL):</label>
        <input type="number" id="fundAmount" placeholder="Enter Amount in SOL" step="any">

        <button onclick="fundWallet()">Fund Wallet</button>
    </div>

    <!-- Attach Wallet Section -->
    <div>
        <h2>Attach Wallet</h2>
        <label for="attachPrivateKey">Private Key:</label>
        <input type="text" id="attachPrivateKey" placeholder="Enter Private Key">

        <label for="attachPublicKey">Public Key:</label>
        <input type="text" id="attachPublicKey" placeholder="Enter Public Key">

        <button onclick="attachWallet()">Attach Wallet</button>
    </div>

     <!-- Recover Wallet Section -->
    <div>
        <h2>Recover Wallet</h2>
        <label for="recoveryPhrase">Recovery Phrase (12 or 24 words):</label>
        <input type="text" id="recoveryPhrase" placeholder="Enter Recovery Phrase">

        <button onclick="recoverWallet()">Recover Wallet</button>
    </div>

    <div>
        <h2>Trading</h2>
        <button onclick="buyTokens()">Buy Tokens</button>
        <button onclick="sellTokens()">Sell Tokens</button>
    </div>

    <div>
        <h2>Automated Trading</h2>
<!--        <label for="privateKey">Private Key:</label>-->
<!--        <input type="text" id="privateKey" placeholder="Enter Private Key (as string)">-->

        <label for="PublicKey">Public Key:</label>
        <input type="text" id="toPubkey" placeholder="Enter Public Key">

        <label for="tokenAddress">Token Address:</label>
        <input type="text" id="tokenAddress" placeholder="Enter Token Address">

        <label for="amount">Amount:</label>
        <input type="number" id="amount" placeholder="Enter Amount">

        <label for="initialPrice">Initial Price:</label>
        <input type="number" id="initialPrice" placeholder="Enter Initial Price">

        <button onclick="startAutoTrade()">Start Auto Trade</button>
    </div>

    <div>
        <h2>Token Price</h2>
        <button onclick="getPrice()">Get Token Price</button>
    </div>

    <div>
        <h2>Logs</h2>
        <pre id="logs"></pre>
    </div>

    <script>
        async function createWallet() {
            const response = await fetch('/create_wallet', { method: 'POST' });
            const data = await response.json();
            alert(`Wallet Created:\nPublic Key: ${data.public_key}\nPrivate Key: ${data.private_key}`);
        }

        async function checkBalance() {
            const publicKey = prompt("Enter Public Key:");
            const response = await fetch('/check_balance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ public_key: publicKey })
            });
            const data = await response.json();
            alert(`Balance: ${data.balance} lamports`);
        }

        async function fundWallet() {
            const publicKey = document.getElementById('fundPublicKey').value;
            const amount = document.getElementById('fundAmount').value;

            if (!publicKey || !amount) {
                alert("Please enter both public key and amount.");
                return;
            }

            const response = await fetch('/fund_wallet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ public_key: publicKey, amount: parseFloat(amount) })
            });

            const data = await response.json();

            if (data.error) {
                alert(`Error: ${data.error}`);
            } else {
                alert(`Airdrop Requested! Transaction ID: ${data.transaction_id}`);
            }
        }

        async function attachWallet() {
            const privateKey = document.getElementById('attachPrivateKey').value;
            const publicKey = document.getElementById('attachPublicKey').value;

            if (!privateKey || !publicKey) {
                alert("Please enter both private key and public key.");
                return;
            }

            const response = await fetch('/attach_wallet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ private_key: privateKey, public_key: publicKey })
            });

            const data = await response.json();

            if (data.status === "success") {
                alert(`Wallet Attached Successfully!\nPublic Key: ${data.public_key}`);
            } else {
                alert(`Error: ${data.message}`);
            }
        }

        async function buyTokens() {
            // const privateKey = prompt("Enter Private Key (as array):");
            // const privateKey = prompt("Enter Private Key (as string):");
            const from_pubkey = prompt("Enter Destination Public Key:");
            const amount = prompt("Enter Amount of Coins:");
            const token = prompt("Coin:");
            const response = await fetch('/buy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ from_pubkey: from_pubkey, amount: amount , token:token})
            });
            const data = await response.json();
            alert(`Transaction ID: ${data.tx_id}`);
        }

        async function sellTokens() {
            // const privateKey = prompt("Enter Private Key (as string):");
            const from_pubkey = prompt("Enter Destination Public Key:");
            const amount = prompt("Enter Number of Coins:");
            const token = prompt("Coin:");
            const response = await fetch('/sell', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({from_pubkey: from_pubkey, amount: amount, token:token})
            });
            const data = await response.json();
            alert(`Transaction ID: ${data.tx_id}`);
        }

        async function startAutoTrade() {
            // const privateKey = document.getElementById('privateKey').value;
            const toPubkey = document.getElementById('toPubkey').value;
            const amount = document.getElementById('amount').value;
            const initialPrice = document.getElementById('initialPrice').value;
            const tokenAddress = document.getElementById('tokenAddress').value;

            if (!toPubkey || !amount || !initialPrice || !tokenAddress) {
        alert("Please fill in all fields.");
        return;
    }

            const response = await fetch('/trade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    // private_key: privateKey,
                    to_pubkey: toPubkey,
                    amount: parseFloat(amount),
                    initial_price: parseFloat(initialPrice),
                    token_address: tokenAddress
                })
            });

            const data = await response.json();
            alert(`Trading Status: ${data.status}\nMessage: ${data.message}`);
            // Reset the values of the input fields after the trade
            // document.getElementById('privateKey').value = '';
            document.getElementById('toPubkey').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('initialPrice').value = '';
            document.getElementById('tokenAddress').value = '';
            fetchLogs();
        }

        async function getPrice() {
            const tokenAddress = prompt("Enter Token Address:");
            const response = await fetch(`/get_price?token_address=${tokenAddress}`);
            const data = await response.json();
            alert(`Token Price: ${JSON.stringify(data)}`);
        }

        async function fetchLogs() {
            const response = await fetch('/get_logs');
            const data = await response.json();
            document.getElementById('logs').innerHTML = syntaxHighlight(JSON.stringify(data, null, 2));
        }

        function syntaxHighlight(json) {
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?)|(\b(true|false|null)\b)|(\b\d+(\.\d+)?\b)/g, function (match) {
                let cls = 'number';
                if (/^"/.test(match)) {
                    cls = /:$/.test(match) ? 'key' : 'string';
                } else if (/true|false/.test(match)) {
                    cls = 'boolean';
                }
                return `<span class="${cls}">${match}</span>`;
            });
        }
        async function recoverWallet() {
            const recoveryPhrase = document.getElementById('recoveryPhrase').value;

            if (!recoveryPhrase) {
                alert("Please enter a recovery phrase.");
                return;
            }

            const response = await fetch('/recover_wallet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ recovery_phrase: recoveryPhrase })
            });

            const data = await response.json();

            if (data.status === "success") {
                alert(`Wallet Recovered Successfully!\nPublic Key: ${data.public_key}`);
            } else {
                alert(`Error: ${data.message}`);
            }
        }
        async function fetchAvailableTokens() {
            const response = await fetch('/available_tokenss');
            const data = await response.json();
            const coinMonitoringDiv = document.getElementById('coin-monitoring');
            coinMonitoringDiv.innerHTML = ''; // Clear previous data

            data.forEach(token => {
                const coinDiv = document.createElement('div');
                coinDiv.className = 'coin';
                coinDiv.innerHTML = `
                    <h3>${token.account_address}</h3>
                    <p>Price: $${token.price_usd}</p>
                `;
                coinMonitoringDiv.appendChild(coinDiv);
            });
        }

        setInterval(fetchAvailableTokens, 15000); // Fetch token data every 10 seconds
        fetchAvailableTokens(); // Initial fetch
